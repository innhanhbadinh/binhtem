<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f0efe8"/>
      <rect width="8" height="8" fill="#e6e4d8"/>
      <rect x="8" y="8" width="8" height="8" fill="#e6e4d8"/>
    </pattern>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c22a63"/>
    </marker>
  </defs>

  <!-- ===== BEN TRAI: SAI ===== -->
  <g transform="translate(30,24)">
    <!-- Dau X ve bang vector, khong dung ky tu unicode (tranh loi font) -->
    <g transform="translate(88,2)" stroke="#c22a63" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="12" y2="12"/>
      <line x1="12" y1="0" x2="0" y2="12"/>
    </g>
    <text x="112" y="14" text-anchor="start" font-size="17" font-weight="700" fill="#c22a63">Sai</text>

    <rect x="0" y="30" width="260" height="200" fill="url(#checker)" stroke="#c22a63" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="130" cy="130" r="55" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.5"/>
    <text x="130" y="135" text-anchor="middle" font-size="13" fill="#6b6b63">Tem</text>

    <line x1="10" y1="130" x2="65" y2="130" stroke="#c22a63" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <line x1="250" y1="130" x2="195" y2="130" stroke="#c22a63" stroke-width="1.5" marker-end="url(#arrowRed)"/>

    <text x="130" y="256" text-anchor="middle" font-size="12.5" fill="#1c1c1a">Trang PDF to hơn tem,</text>
    <text x="130" y="273" text-anchor="middle" font-size="12.5" fill="#1c1c1a">dư khoảng trắng xung quanh</text>
  </g>

  <!-- Mui ten chuyen huong o giua -->
  <g transform="translate(360,150)">
    <path d="M -20 0 L 20 0 M 8 -12 L 20 0 L 8 12" stroke="#6b6b63" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ===== BEN PHAI: DUNG ===== -->
  <g transform="translate(430,24)">
    <!-- Dau check ve bang vector -->
    <g transform="translate(88,1)" stroke="#234d3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0,7 L5,13 L15,0"/>
    </g>
    <text x="140" y="14" text-anchor="start" font-size="17" font-weight="700" fill="#234d3d">Đúng</text>

    <rect x="20" y="75" width="220" height="110" fill="url(#checker)" stroke="#234d3d" stroke-width="2.5"/>
    <circle cx="130" cy="130" r="55" fill="#ffffff" stroke="#1c1c1a" stroke-width="1.5"/>
    <text x="130" y="135" text-anchor="middle" font-size="13" fill="#6b6b63">Tem</text>

    <text x="130" y="256" text-anchor="middle" font-size="12.5" fill="#1c1c1a">Kích thước trang PDF</text>
    <text x="130" y="273" text-anchor="middle" font-size="12.5" fill="#1c1c1a">bằng đúng khung tem, sát mép</text>
  </g>
</svg>
